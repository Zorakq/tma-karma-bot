# Render Blueprint.
# Подключите репозиторий в Render (New -> Blueprint), и он развернёт ОДИН web-сервис:
#   - karma-server: REST API + Mini App + Telegram-бот (все в одном процессе)
#
# База данных — бесплатный Neon/Supabase (Render за свою БД просит карту).
# Вставьте его строку подключения в DATABASE_URL при деплое.
#
# Бесплатный тариф Render не поддерживает background worker, поэтому бот запускается
# внутри web-сервиса (см. server/src/render.ts).

services:
  - type: web
    name: karma-server
    runtime: node
    plan: free
    buildCommand: npm run db:push:pg && npm run build
    startCommand: npm run start:render -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BOT_TOKEN
        sync: false
      - key: INIT_DATA_MAX_AGE_SECONDS
        value: "86400"
      - key: DATABASE_URL
        sync: false
